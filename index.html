<!DOCTYPE html>
<html>
<head>
<title>Minutes 2 issue converter</title>
<meta charset="utf-8" />
<style>
h2 { margin-top: 2em; font-weight:300; color:#900; border-top: 1px solid #ccc; text-align: end; margin-left: 5%; margin-right: 2%;  }
.tagtitle { font-weight:bold; color:#900; font-size: 110%; margin-bottom: 0; margin-left: 5%; }
.tagbody { margin-top: 0; margin-bottom: 0; margin-left: 5%; }
.tagbody::after {
	content: ' ' attr(title);
	font-size: 12px;
	margin-left: 10px;
	float: right;
	margin-right: 2em;
	}
a { color: #ccc; text-decoration: none; font-wieght: 300; }
#highlightToggle { border: 0; border-radius: 8px; margin-right: 3em; }
body { color: #aaa;  font-family: "helvetica neue", sans-serif; font-weight: 300; }
b { font-weight:bold; color:#900; font-size: 120%; }
i { font-weight:bold; color:#900; font-size: 90%; }
strong { color: orange; color: #900; font-weight: normal; font-size: 100%;  }
.demihighlight { color: #333; font-weight: normal; font-size: 90%;  }
.highlight { color: orange; color: #900; font-weight: normal; font-size: 100%;  }
.topic { color: rgba(1,192,248,1.00); font-weight: normal; font-size: 100%;  }
.standard { font-size: 90%; }
cite { color: rgba(1,192,248,1.00); font-size: 90%; }
em { color: #B66B37; font-weight: normal; font-style: italic;  }
h1 { margin-top: 1em; }
p:hover { background-color: #eee; }

#flexContainer {  }
#displayArea { width: 50%; }
#text { position: fixed; right: 0; top: 1em; width: 50%; text-align: right; }
#instructions { width: 50%; }
#input { width: 90%; border: 0; height: 93vh; margin-top: 5vh; }
input[type=button] { cursor: pointer; }

.smallprint {
    font-size: 12px;
    line-height: 1.4;
    color: #999;
    margin: 0;
        margin-top: 0px;
    margin-top: 7em;
    text-align: right;
    clear: both;
    position: fixed;
    right: 0;
    bottom: 10px;
    }
span#version {
    padding: 8px 20px;
    background-color: #f5f5f5;
    }
#version :link, #version :visited {
    color: teal;
    text-decoration: none;
    }
</style>



<script>
function generate (input) {
	// Basic HTML escaping for safety
	//input = input.replace(/&/g, '&amp;')
	//input = input.replace(/</g, '&lt;')

	// Split into lines and prepare output containers
	const inputLines = input.split('\n')
	const htmlLines = []			// processed transcript lines
	const actions = []				// extracted ACTION items
	const resolutions = []			// extracted RESOLUTION items


    // Process substitutions
    // Substitution command: s/old/new/ or s|old|new| (final delimiter optional)
	for (let i = 0; i < inputLines.length; i++) {
		let line = inputLines[i].trim()
        const subMatch = line.match(/s([\/|])(.*?)[\/|](.*?)(?:\1)?$/)

        if (subMatch) {
            const delim = subMatch[1]			// / or |
            const oldText = subMatch[2]
            const newText = subMatch[3]

            // console.log('%cSUBSTITUTION:', 'color: red; font-weight: bold', oldText, '→', newText)

            // Search backwards through previous lines
            for (let j = i - 1; j >= 0; j--) {
                let prev = inputLines[j]

                // If this line contains the old text, substitute and stop
                if (prev && prev.includes(oldText)) {
                    inputLines[j] = prev.replace(oldText, newText)
                    break
                    }
                }

            // Remove this substitution command line
            inputLines[i] = ''
            continue            
            }
        
        
		// Neuter any markup
		if (line.match(/</g)) // console.log('ANGLE BRACKET DETECTED HERE !')
		inputLines[i] = line.replace(/</g, '&lt;')
        }




	// Process each line
	for (let i = 0; i < inputLines.length; i++) {
		let line = inputLines[i].trim()
        // console.log('%cLINE: ' + line, 'color: red; font-weight: bold')
        
        if (line.match(/&lt;Zakim>/)) continue

        // Detect and strip scribe name when appropriate
        // Pattern: <xxxx>Speaker:   OR   <xxxx>   ...continuation...
        const scribeMatch = line.match(/^&lt;([^>]+)>\s+(.*)$/)

        if (scribeMatch) {
            const scribe = scribeMatch[1]	// the xxxx inside <xxxx>
            let rest = scribeMatch[2].trim() // text after the scribe name
            // console.log('SCRIBE',scribe)
            // console.log('REST',rest)
            

            // Delete lines that start with ack, q+, or q-
            if (rest.match(/^(ack|q\+|q-|scribenick)/i)) {
                // console.log('SKIPPING QUEUE LINE:', rest)
                continue
                }


            // Case 1: Speaker name (ends with :)
            if (rest.match(/^[^:]+:/)) { // console.log('speaker match found')
                line = rest	// strip scribe, keep speaker
                }

            // Case 2: Continuation line (one or more dots)
            else if (rest.match(/^\s*[.\u2026]+/)) { // console.log('continuation match found')
                line = rest	// strip scribe, keep dots
                }

            // Otherwise leave the line unchanged (scribe name stays)
            }


        // console.log("PARSED LINE: ",line)






		// Highlight speaker names like <foo>
		line = line.replace(/^&lt;([^>]+)>/g, '<b>&lt;$1&gt;</b>')

		// Highlight prefixes like "Alice:" or "RESOLVED:"
		line = line.replace(/^([^: ]+):/g, '<b>$1:</b>')
        if (line.match('RESOLVED')) // console.log('RESOLUTION !')

		// Undo bolding of URLs
		line = line.replace(/<b>https:<\/b>/g, 'https:')
		line = line.replace(/<b>http:<\/b>/g, 'http:')

		// Convert URLs to links
		line = line.replace(/https:([^ ]+)/g, '<a href="https:$1">https:$1</a>')
		line = line.replace(/http:([^ ]+)/g, '<a href="http:$1">http:$1</a>')

		// Add processed line to transcript output
		if (line !== '')
			htmlLines.push(line + '<br/>\n')

		// --- ACTION extraction ---------------------------------------------

		// "Created ACTION-123 - description"
		if (line.includes('Created ACTION-'))
			actions.push(line.substr(line.indexOf(' - ') + 3))

		// "Action #123: description" (scribejs)
		if (line.match(/^Action #\d+:/))
			actions.push(line.substr(line.indexOf(':') + 1))

		// --- RESOLUTION extraction -----------------------------------------

		// RESOLVED:
		if (line.includes('RESOLVED:</b>'))
			resolutions.push(line.substr(line.indexOf('RESOLVED:') + 13))
		else if (line.includes('RESOLVED:'))
			resolutions.push(line.substr(line.indexOf('RESOLVED:') + 9))

		// RESOLUTION:
		if (line.includes('RESOLUTION:</b>'))
			resolutions.push(line.substr(line.indexOf('RESOLUTION:') + 15))
		else if (line.includes('RESOLUTION:'))
			resolutions.push(line.substr(line.indexOf('RESOLUTION:') + 11))

		// "Resolution #123: description" (scribejs)
		if (line.match(/^Resolution #\d+:/))
			resolutions.push(line.substr(line.indexOf(':') + 1))
	}

	// --- Build summary -----------------------------------------------------

	let result = 'This issue was discussed in '

	const url = document.getElementById('url').value
	if (url)
		result += '[a meeting](' + url + ')'
	else
		result += 'a meeting'

	result += '.\n\n'

	// No actions or resolutions
	if (actions.length === 0 && resolutions.length === 0)
		result += '- No actions or resolutions\n'
	else {
		// List resolutions
		if (resolutions.length > 0)
			for (let i = 0; i < resolutions.length; i++)
				result += `<p style="font-weight:bold; color: #666">- RESOLVED: ${ resolutions[i] }</p>`

		// List actions
		if (actions.length > 0)
			for (let i = 0; i < actions.length; i++)
				result += `<p style="font-weight:bold; color: #666">- ACTION: ${ actions[i] }</p>`
	}

	// --- Append transcript -------------------------------------------------

	result += '<details><summary><i class="differentiate">View the transcript</i></summary>\n'
	result += htmlLines.join('')
	result += '</details>'

	document.getElementById('rendered').innerHTML = result // show rendered HTML
    document.getElementById('rendered').querySelector('details').open = true

	return result
    }
	
</script>
</head>





<body>
<h1>Convert minutes to github issue comments</h1>


<p>URL of meeting minutes: <input id="url" type="text" style="width: 50%;"/></p>
<div style="display: flex; flex-direction: row; flex-wrap: nowrap;">
<textarea id="in" style="flex: 1; height: 60vh;" placeholder="Copy/paste a section of the minutes here."></textarea>
<textarea id="out" style="flex: 1; height: 60vh;" placeholder="Copy the result from here into a github issue."></textarea>
</div>



<div id="instructions" style="font-size: 90%; float:inline-end; colour: chocolate;">
<p><a href="https://github.com/r12a/mins2issue/blob/gh-pages/README.md">&nbsp; How to use this</a></p>
</div>

<div id="controlPanel" style="background-color: white; width: 100%; height:2em; margin-top: .5em;">
<button style="font-size: 100%" onclick="document.getElementById('out').value = generate(document.getElementById('in').value);document.getElementById('out').select();">Generate issue comment</button>

<input type="button" onclick="document.getElementById('in').value = ''; " value="Clear input box" />

</div>


<div id="rendered" style="margin-block-end:5em;">Rendered text for checking.</div>





<div class="smallprint"><span id="version">
See <a href="https://github.com/r12a/mins2issue/commits/gh-pages">recent changes</a>.
Make a <a href="https://github.com/r12a/mins2issue/issues">comment</a>.

</span>
</div>
</body>
</html>
